name: megakernel-ci-test
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on: [push]
jobs:
  Explore-GitHub-Actions:
    runs-on: self-hosted
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          path: ./repo

      - name: Verify local Docker image
        run: docker image inspect pk_dev_image

      - name: Run workflow commands inside local Docker image
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/repo:/workspace/repo" \
            -w /workspace/repo \
            pk_dev_image \
            bash -lc '
              echo "🎉 The job was automatically triggered by a ${{ github.event_name }} event."
              echo "🐧 This job is now running on a ${{ runner.os }} server hosted by GitHub!"
              echo "🔎 The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
              echo "💡 The ${{ github.repository }} repository has been cloned to the runner."
              echo "🖥️ The workflow is now ready to test your code on the runner."
              test -f /.dockerenv && echo "RUNNING INSIDE DOCKER"
              echo "📝 The contents of the current working directory are:"
              ls
              echo "📂 The current working directory is ./repo ."
              ls -la
              echo "🍏 This job'\''s status is ${{ job.status }}."
            '
