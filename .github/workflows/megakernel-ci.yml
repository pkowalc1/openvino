name: Megakernel-CI
run-name: Megakernel CI Benchmark/Tests
on:
  push:
    branches:
    - megakernel_poc_2026_master_branch
  pull_request:
  workflow_dispatch:

jobs:
  Megakernel-CI:
    name: Megakernel-CI (${{ matrix.megakernel }})
    runs-on: self-hosted
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - megakernel: Qwen06BPOC_prefill_separate_kernels
            model_id: Qwen/Qwen3-0.6B
          - megakernel: Gemma4POC
            model_id: google/gemma-4-26B-A4B-it
            export_args: --task image-text-to-text --weight-format int4
            e2e_args: --decode-mode greedy
    env:
      MEGAKERNEL: ${{ matrix.megakernel }}
      MODEL_ID: ${{ matrix.model_id }}
      EXPORT_ARGS: ${{ matrix.export_args }}
      E2E_ARGS: ${{ matrix.e2e_args }}
      # Exported IRs persist across runs.
      MODELS_HOST_DIR: /opt/home/sys_ovwindev/megakernel_models
      MODELS_DIR: /models
    steps:
      - name: Cleanup workspace
        if: always()
        run: |
          sudo chmod -R 777 ${{ github.workspace }} || true
          rm -rf ${{ github.workspace }}/* || true

      - name: Check out repository code
        uses: actions/checkout@v6
        with:
          clean: true
          submodules: 'recursive'

      - name: Compile ov with megakernel
        env:
          WORKSPACE_REPO: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm \
            -v "$WORKSPACE_REPO:/workspace/repo" \
            -v "$MODELS_HOST_DIR:$MODELS_DIR" \
            -w /workspace/repo \
            -e GITHUB_TOKEN -e MEGAKERNEL -e MODEL_ID -e EXPORT_ARGS -e MODELS_DIR \
            --device /dev/dri --group-add=$(stat -c "%g" /dev/dri/render* | sort -u) \
            ci_megakernel_image \
            bash -lc '
              set -Eeuo pipefail
              git config --global --add safe.directory /workspace/repo
              git config --global user.email "ci@openvino.local"
              git config --global user.name "CI Megakernel"
              github_auth=$(printf "x-access-token:%s" "$GITHUB_TOKEN" | base64 -w0)
              git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $github_auth"
              unset github_auth GITHUB_TOKEN
              echo "building megakernel:"
              bash MEGAKERNEL_POC/ci_scripts/build_megakernel.sh
              echo "DONE! This job'\''s status is ${{ job.status }}."
            '

      - name: Run tests and benchmarks
        env:
          WORKSPACE_REPO: ${{ github.workspace }}
        run: |
          docker run --rm \
            -v "$WORKSPACE_REPO:/workspace/repo" \
            -v "$MODELS_HOST_DIR:$MODELS_DIR:ro" \
            -w /workspace/repo \
            -e MODEL_ID -e E2E_ARGS -e MODELS_DIR \
            --device /dev/dri --group-add=$(stat -c "%g" /dev/dri/render* | sort -u) \
            ci_megakernel_image \
            bash -lc '
              set -Eeuo pipefail
              git config --global --add safe.directory /workspace/repo
              echo "running megakernel tests:"
              bash MEGAKERNEL_POC/ci_scripts/run_megakernel_tests.sh
              echo "DONE! This job'\''s status is ${{ job.status }}."
            '

